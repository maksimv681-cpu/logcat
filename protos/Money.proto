// Recovered from the client's protobuf-lite descriptors. Not recoverable: field names inside
// oneof groups, map key/value types; enum type names may be shortened by obfuscation.
syntax = "proto2";

option java_outer_classname = "Money";

message MoneyProto {
  optional int32 money = 1;
  optional int32 gold = 2;
  optional int32 tournament_points = 3;
  optional int32 top_points = 4;
  optional int32 exp_points = 6;
  optional int32 fuel_points = 7;
  optional int32 laurel_points = 8;
  optional int32 nitro_points = 9;
  optional int32 diamond_points = 10;
  optional int32 event_tokens = 11;
  optional int32 bonus_tokens = 12;
}
