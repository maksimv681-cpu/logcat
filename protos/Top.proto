// Recovered from the client's protobuf-lite descriptors. Not recoverable: field names inside
// oneof groups, map key/value types; enum type names may be shortened by obfuscation.
syntax = "proto2";

option java_outer_classname = "Top";

message BaseStageProto {
  optional int32 base_id = 1;
  optional int32 max_hp = 2;
  optional string key_name = 3;
}

message TeamCompetitionTopItemProto {
  optional string user_name = 1;
  optional string clan_tag = 2;
  optional int64 last_car_id = 3;
  optional int32 rang_points = 4;
  optional TCIdProto cid = 5;
}

message TopItemProto {
  optional int64 id = 1;
  optional UserInfoProto info = 2;
  optional CarSafeProto car = 3;
  optional int32 points = 4;
  optional int32 place = 6;
  optional float time804 = 7;
  optional int32 car_base_id = 8;
  optional CarNumberProto number = 9;
  optional float hpt = 10;
  optional int32 type = 11;
  optional bytes payload = 12;
}

message TopProto {
  repeated TopItemProto top_list = 1;
  optional int32 place = 3;
  optional int32 challenge_id = 4;
}

message TopTypeProto {
  optional bool is_time_top = 1;
  optional bool is_solo = 2;
  optional string car_class = 3;
  optional bool is_championship_top = 5;
  optional bool is_current_season = 6;
  optional bool is_challenge_top = 7;
  optional int32 challenge_id = 8;
  optional bool is_stage_top = 9;
  optional int32 stage_id = 10;
  optional bool is_swap = 11;
  optional int32 type = 12;
  optional bytes payload = 13;
}
