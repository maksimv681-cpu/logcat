syntax = "proto2";

option java_outer_classname = "Transaction";

message AddPendingTransactionEventProto {
  optional int64 uid = 1;
  optional PendingTransactionProto transaction = 2;
}

message PendingTransactionProto {
  optional int64 id = 1;
  optional int64 timestamp = 2;
  optional int32 /* enum */ type = 3;
  optional string description = 4;
  optional MoneyProto money = 5;
}

message TransactionDataProto {
  optional string product_id = 1;
  optional string gpa = 2;
