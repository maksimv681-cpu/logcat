// Recovered from the client's protobuf-lite descriptors. Not recoverable: field names inside
// oneof groups, map key/value types; enum type names may be shortened by obfuscation.
syntax = "proto2";

option java_outer_classname = "ConfiguratorGarage";

message ConfiguratorCarContainerProto {
  optional int32 id = 1;
  optional UserCarProto car = 2;
  repeated int32 clan_upgrades = 3;
}

message ConfiguratorGarageProto {
  repeated ConfiguratorCarContainerProto car_containers = 1;
}
