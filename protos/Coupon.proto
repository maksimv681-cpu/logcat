// Recovered from the client's protobuf-lite descriptors. Not recoverable: field names inside
// oneof groups, map key/value types; enum type names may be shortened by obfuscation.
syntax = "proto2";

option java_outer_classname = "Coupon";

message CouponProto {
  optional int64 id = 1;
  optional BaseCouponProto base_coupon = 2;
  optional int32 base_id = 3;
  optional int32 amount = 4;
}
