message CarEffectDataProto {
  optional int32 id = 1;
  optional CarEffectDataProtoEnum type = 2;
  optional float rotation = 3;
  optional float position_x = 4;
  optional float position_y = 5;
  optional float denstity = 6;
  optional float size = 7;
  optional float time = 8;
  optional float time_life = 9;
  optional float temerature = 10;
  optional int32 smoke_color = 11;
  optional CarEffectDataProtoEnum layer = 12;
  optional float speed_count = 13;
  optional bool flipped = 14;
  enum CarEffectDataProtoEnum {
    NONE = 0;
    WHEEL_SMOKE = 1;
    WHEEL_DUST = 2;
    WHEEL_DIRT = 3;
    SPARK = 4;
    ENGINE_SMOKE = 5;
    THREAD_START = 6;
    THREAD_END = 7;
    POINT_SMOKE = 8;
    WHEEL_SNOW = 9;
    WHEEL_DIG = 10;
    WHEEL_DIG_OUT = 11;
  }
  enum CarEffectDataProtoEnum {
    BEHIND_CAR = 0;
    IN_FRONT_OF_CAR = 1;
    IN_FRONT_OF_FRONT_GROUND = 2;
  }
}

