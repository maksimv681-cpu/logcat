// Recovered from the client's protobuf-lite descriptors. Not recoverable: field names inside
// oneof groups, map key/value types; enum type names may be shortened by obfuscation.
syntax = "proto2";

option java_outer_classname = "WorldDataContainer";

message CarControlProto {
  optional int64 car_id = 1;
  optional CarControlProtoEnum type = 2;
  optional float value = 3;
  repeated float points = 4;
  enum CarControlProtoEnum {
    START_ENGINE = 0;
    STOP_ENGINE = 1;
    SHIFT_UP = 2;
    SHIFT_DOWN = 3;
    ACCELERATE = 4;
    BRAKE = 5;
    SET_NEUTRAL = 6;
    SET_TRANSMISSON_MODE = 7;
    SET_HEATTED = 8;
    LOCK_TIRES_TEMP = 9;
    SET_CLUTCH = 10;
    SET_HAND_BRAKING = 11;
    STOP = 12;
    MOVE_FORWARD = 13;
    MOVE_BACKWARD = 14;
    TRANSLATE = 15;
    SET_ODOMETER = 16;
    SET_FRONT_WHEEL_TEMPERATURE = 17;
    SET_FRONT_WHEEL_TEMPERATURE_LOCKED = 18;
    SET_REAR_WHEEL_TEMPERATURE = 19;
    SET_REAR_WHEEL_TEMPERATURE_LOCKED = 20;
    UPDATE_CONFIG = 21;
    SET_CURRENT_GEAR = 23;
    CHANGE_ENGINE_STATE = 24;
    POST_STARTED_EVENT = 25;
    UPDATE_BEHAVIOR_RPM = 26;
    SET_BEHAVIOR = 27;
    START_BEHAVIOR_UPDATE = 28;
    REFILL_STATIC_DATA = 29;
    LOCK_DESTROY_TIRES = 30;
    CREATE_RECORDER = 31;
    UPDATE_BEHAVIOR_TIRES_HEAT = 32;
    SET_CRUISE_CONTROL = 33;
    SET_DRIVE = 34;
    FLASHER_UP = 35;
    FLASHER_DOWN = 36;
    HEADLIGHT_UP = 37;
    HEADLIGHT_DOWN = 38;
    STROBOSCOPE_UP = 39;
    STROBOSCOPE_DOWN = 40;
    START_ECU_TEST = 41;
    STOP_ECU_TEST = 42;
    SET_NITRO_ENABLED = 43;
    REFILL_NITRO = 44;
  }
}

