message CreateWorldObjectEventProto {
  optional int32 id = 1;
}

message DestroyWorldObjectEventProto {
  optional int32 id = 1;
}

message EnterLimitZoneEventProto {
  optional BaseLimitZoneProto base_limit_zone = 1;
}

message LimitZoneStopEventProto {
  optional BaseLimitZoneProtoEnum zone_type = 1;
}

message LookToCarEventProto {
  optional int64 online_member_id = 1;
  optional int64 look_car_id = 2;
}

message TrafficLightEventProto {
  optional int32 int_traffic_light_state = 1;
}

message ViolationStateEventProto {
  optional bool violating = 1;
  optional BaseLimitZoneProtoEnum zone_type = 2;
  optional int32 violation_size = 3;
  optional float multiple_award = 4;
}

message WorldDataObjectProto {
  optional int64 id = 1;
  optional int32 /* enum */ type = 2;
  optional bytes data = 3;
}

message WorldEventContainerProto {
  repeated WorldEventProto events = 1;
}

message WorldEventProto {
  optional int64 id = 1;
  optional WorldEventProtoEnum event_class = 2;
  optional WorldEventProtoEnum event_type = 3;
  optional float value = 4;
  optional int64 car_id = 5;
  optional WorldParamsProto world_params = 6;
  optional bytes extends_payload = 7;
  enum WorldEventProtoEnum {
    CAR = 0;
    RACE = 1;
    CREATE_OBJECT = 2;
    DESTROY_OBJECT = 3;
    WORLD_EXCEPTION = 4;
  }
  enum WorldEventProtoEnum {
    SLOW_MOTION_START = 0;
    SLOW_MOTION_END = 1;
    START_COUNTDOWN = 21;
    GO = 23;
    REAR_WHEEL_BROKE = 4;
    FRONT_WHEEL_BROKE = 5;
    SHIFT = 6;
    SHIFT_UP = 7;
    SHIFT_DOWN = 8;
    CUTOFF = 9;
    BROKEN = 10;
    SHIFT_FINISH = 11;
    ENGINE_START = 12;
    ENGINE_STARTED = 13;
    ENGINE_STOP = 14;
    TRACE_TREAD_START = 15;
    TRACE_TREAD_END = 16;
    WHEEL_SMOKE_BEGIN = 17;
    WHEEL_SMOKE_END = 18;
    SHIFT_FAILED = 19;
    BLOW_OFF = 20;
    READY_TO_START = 22;
    DISQUALIFIED = 22;
    PLAYER_FINISHED = 24;
    FINISH = 25;
    WHEEL_BUMP = 26;
    OBJECT = 27;
    START_ENGINE_VIBRATE = 28;
    LIMIT_ZONE_VIOLATION = 29;
    LIMIT_ZONE_ENTER = 30;
    TRAFFIC_LIGHT = 31;
    LIMIT_ZONE_STOP = 32;
    TRANSMISSION_TYPE = 33;
    EXCEPTION = 34;
    CHASSIS_STOPPED = 35;
    CAR_UPSIDE_DOWN = 36;
    CAR_ON_WHEELS = 37;
    FULL_DRIVE = 38;
    REAR_WHEEL_DRIVE = 39;
    FRONT_WHEEL_DRIVE = 40;
    CAR_STATIC_DATA_UPDATED = 41;
    LOOK_TO_CAR = 42;
    DELAY_RUN = 43;
    TIME_LEFT = 44;
    NITRO_INJECT_STATUS = 45;
  }
}

message WorldNetEventProto {
  optional int32 order = 1;
  optional int64 online_race_id = 2;
  optional WorldNetEventProtoEnum type = 3;
  optional int64 timestamp = 4;
  optional float time = 5;
  optional CarControlProto control = 6;
  repeated CarDataProto data = 7;
  optional WorldEventProto event = 8;
  repeated WorldDataObjectProto objects = 9;
  optional CreateWorldObjectEventProto create_event = 10;
  optional DestroyWorldObjectEventProto destroy_event = 11;
  enum WorldNetEventProtoEnum {
    CONTROL = 0;
    DATA = 1;
    EVENT = 2;
  }
}

message WorldParamsProto {
  optional int32 /* enum */ type = 1;
  optional bytes data = 2;
}
