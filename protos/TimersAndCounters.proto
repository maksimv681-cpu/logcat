  optional int32 show_new_clan_tournaments = 15;
  optional int64 buy_swap_detail_timer = 16;
  optional int64 sell_swap_detail_timer = 17;
  optional int64 clan_leave_penalty = 18;
  optional int32 days_online_in_row = 19;
