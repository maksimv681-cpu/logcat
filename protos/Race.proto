// Recovered from the client's protobuf-lite descriptors. Not recoverable: field names inside
// oneof groups, map key/value types; enum type names may be shortened by obfuscation.
syntax = "proto2";

option java_outer_classname = "Race";

message FinishParamsProto {
  optional int32 /* enum */ type = 1;
  optional int64 enemy_id = 2;
  optional bytes enemy_sig = 3;
  optional bytes user_sig = 4;
  optional RaceStatisticProto race_statistic = 5;
  optional float enemy_time = 6;
  optional float enemy_break = 7;
  optional float user_break = 8;
  optional int32 user_distance = 9;
  optional BehaviorProto behavior = 10;
  optional bytes track_sig = 11;
  optional int64 user_car_id = 12;
  optional int32 user_detonation_count = 13;
  optional float max_psi = 14;
  optional float nitro_quantity = 15;
  optional bool is_broken_user_car = 16;
  optional float max_chassis_body_rotation = 17;
}

message RaceAwardProto {
  optional MoneyProto money = 1;
  optional int32 exp = 2;
  repeated CarUpgradeProto upgrdes = 3;
  optional int32 /* enum */ result = 4;
  optional int32 /* enum */ type = 5;
  optional EnemyProto enemy = 6;
  optional bool is_can_repeat = 7;
  optional float user_time = 9;
  optional float track_time = 10;
  optional float best_time = 11;
  optional int32 last_place = 12;
  optional int32 current_place = 13;
  repeated ItemProto items = 14;
  optional float award_multi = 21;
  optional int32 clan_points = 22;
  repeated LootboxProto lootboxes = 23;
  optional ChampionshipResultProto new_championship_result = 24;
  optional ChampionshipResultProto old_championship_result = 25;
  optional DropboxProto drop_box = 26;
  optional bool special = 27;
  optional int32 event_points = 28;
  optional int32 stars = 29;
}

message RaceSnapshotsProto {
  optional int64 id = 1;
  optional int64 car_id = 2;
  optional UserCarProto car = 3;
  optional TrackProto track = 4;
  repeated CarDataProto data = 5;
}

message RaceStatisticProto {
  optional float time_to100 = 1;
  optional float time_to200 = 2;
  optional float max_speed = 3;
  optional float race_time = 4;
  optional float quality = 5;
}

message RaceStrategySettingProto {
  optional int32 id = 1;
  optional int32 /* enum */ type = 2;
  repeated int32 summer_tracks = 3;
  repeated int32 autumn_tracks = 4;
  repeated int32 winter_tracks = 5;
  repeated int32 spring_tracks = 6;
  optional MoneyProto win_reward = 7;
  optional MoneyProto draw_reward = 8;
  optional MoneyProto loose_reward = 9;
  repeated int32 loot_ids = 10;
  optional int32 fuel_for_race = 11;
  optional int32 distance = 12;
  optional int32 brake_distance = 13;
  optional int32 clan_points = 14;
  repeated RewardMultiples reward_multiples = 15;
}

message RewardMultiples {
  optional int32 level = 1;
  repeated int32 reward_multiples = 2;
}

message StartParamsProto {
  optional int32 /* enum */ type = 1;
  optional int64 enemy_id = 2;
  optional bytes enemy_sig = 3;
  optional bytes user_sig = 4;
  optional int64 tournament_id = 5;
  optional int32 track_id = 6;
  optional int32 challenge_id = 7;
  optional int64 car_id = 8;
  optional bytes user_car = 9;
  optional int64 lobby_id = 10;
  optional TCIdProto enemy_c_id = 11;
  optional int32 reward_multiple_id = 12;
  optional int64 chat_message_id = 13;
  optional int32 chat_room_type_id = 14;
  optional int32 event_stage_id = 15;
}

message StatisticContainerProto {
  optional RaceStatisticProto current = 1;
  optional RaceStatisticProto best = 2;
}
