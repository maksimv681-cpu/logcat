// Recovered from the client's protobuf-lite descriptors. Not recoverable: field names inside
// oneof groups, map key/value types; enum type names may be shortened by obfuscation.
syntax = "proto2";

option java_outer_classname = "Mail";

message MailBoxProto {
  repeated MailMessageProto mails = 1;
  optional bool is_loaded = 2;
}

message MailCounterProto {
  optional int32 count = 1;
}

message MailMessageProto {
  optional int64 id = 1;
  optional string from_name = 2;
  optional int64 from_uid = 3;
  optional int64 to_uid = 4;
  optional int64 time = 5;
  optional string title = 6;
  optional string message = 7;
  optional bool is_readed = 8;
  optional bool is_system = 9;
  optional MoneyProto money = 10;
  optional int32 exp = 11;
  optional int32 fuel = 12;
  optional bool internal = 15;
  optional int32 /* enum */ attachment_type = 16;
  optional bytes attachments = 17;
  optional bool request_rating_on_read = 21;
  optional DropboxProto dropbox = 22;
}
