// Recovered from the client's protobuf-lite descriptors. Not recoverable: field names inside
// oneof groups, map key/value types; enum type names may be shortened by obfuscation.
syntax = "proto2";

option java_outer_classname = "Events";

message ARewardBucketProto {
  optional int32 bucket_id = 1;
  repeated ARewardProto collection = 2;
}

message EventBaseUpgradeSlotDetailProto {
  optional int32 id = 1;
  optional EventUpgradeSlotTypeProto slot_type = 2;
  repeated EventUpgradeValue values = 3;
  optional MoneyProto buy_price = 4;
  optional MoneyProto sell_price = 5;
  optional int32 shop_index = 6;
  optional string grade_color = 7;
  optional string icon = 8;
  optional string atlas = 9;
  optional string name = 10;
  optional string description = 11;
}

message EventBaseUpgradeSlotProto {
  optional int32 id = 1;
  optional int32 steps = 2;
  optional MoneyProto start_price = 3;
  optional MoneyProto end_price = 4;
  optional float price_multiple = 5;
  optional int32 stars = 6;
  optional float stars_multiple = 7;
  optional int32 value_type = 8;
  optional float min_value = 9;
  optional float max_value = 10;
  optional int32 shop_index = 11;
  optional int32 group = 12;
  optional EventUpgradeSlotTypeProto slot_type = 13;
  optional string name = 14;
  optional string icon = 15;
}

message EventBuyFuelInfoProto {
  optional int32 fuel_amount_for_buy = 1;
  optional int32 fuel_buy_count_in_day = 2;
  optional MoneyProto price = 3;
}

message EventColorThemeProto {
  optional string id = 1;
  optional string file_postfix = 2;
  optional string color = 3;
  optional string text_color = 4;
  optional string text_color2 = 5;
}

message EventConfigProto {
  optional int32 id = 1;
  repeated int32 step_ids = 2;
  optional int32 help_id = 3;
  optional int32 rewards_pool_id = 4;
  optional int32 upgrade_slot_pool_id = 5;
  optional int32 max_level = 6;
  optional int32 points_in_level = 7;
  optional int32 top_count = 8;
  optional int32 top_level = 9;
  optional EventBuyFuelInfoProto buy_fuel_info = 10;
  optional int32 shop_index = 11;
  optional int32 top_rewards_pool = 12;
  optional MoneyProto change_car_price = 13;
  optional int32 event_shop_pool = 14;
  optional int32 min_level_for_join = 15;
}

message EventContainerProto {
  optional EventUserDataProto event_user_data = 1;
}

message EventFuelModelProto {
  optional FuelProto fuel = 1;
  optional int32 purchase_count_at_day = 2;
  optional int64 last_purchase_time = 3;
}

message EventHelpItemProto {
  optional string bg = 1;
  optional string icon = 2;
  optional float icon_x_offset = 3;
  optional float icon_y_offset = 4;
  optional string title = 5;
  optional string text = 6;
}

message EventHelpProto {
  optional int32 id = 1;
  repeated EventHelpItemProto item = 2;
}

message EventInfoContainerProto {
  optional EventScheduleProto event_schedule = 1;
  optional EventInstanceProto event_instance = 2;
}

message EventInstanceProto {
  optional int64 id = 1;
  optional int32 base_event_id = 2;
  optional int64 actual_start_time = 3;
  optional int64 actual_end_time = 4;
  optional int64 created_at = 5;
  optional int32 status_id = 6;
}

message EventProgressProto {
  optional int32 points = 1;
  repeated int32 taken_rewards = 2;
}

message EventProto {
  optional int32 id = 1;
  optional string name = 2;
  optional string description = 3;
  optional int32 config_id = 4;
  optional string theme = 5;
  optional string logo = 6;
  optional string bg = 7;
}

message EventScheduleProto {
  optional int32 id = 1;
  optional int32 event_id = 2;
  optional int64 start_time = 3;
  optional int64 end_time = 4;
}

message EventShopDataProto {
  optional int32 count = 1;
  repeated int32 event_shop_item_id = 2;
  repeated int32 purchase_count = 3;
}

message EventShopItemProto {
  optional int32 id = 1;
  optional int32 count = 2;
  optional MoneyProto price = 3;
  optional BaseCountedThingKeyProto base_counted_thing_key = 4;
}

message EventStageProto {
  optional int32 id = 1;
  optional int32 type_id = 2;
  optional int32 max_bot_level = 3;
  optional int32 bot_cooldown_time = 4;
  optional int32 fuel_request = 5;
  optional int32 track_id = 6;
  optional int32 distance = 7;
  optional int32 progress_point = 8;
  optional int32 clan_points = 9;
  optional string icon = 10;
  optional string name = 11;
  optional string description = 12;
  optional int32 secret_rewards_id = 13;
  optional MoneyProto first_win_award = 14;
  optional MoneyProto each_win_award = 15;
  optional int32 stars = 16;
  optional float time = 17;
}

message EventStepModelProto {
  optional int32 event_stage_id = 1;
  optional int64 first_win_time = 2;
  optional int64 cooldown_time = 3;
  optional int32 stars = 4;
  optional bool enabled = 5;
}

message EventTopItemPayloadProto {
  optional int64 event_instance_id = 1;
  optional int32 uid = 2;
  optional string user_name = 3;
  optional string clan_tag = 4;
  optional int64 car_id = 5;
  optional int32 carbase_id = 6;
}

message EventUpgradeSlotBaseBucketProto {
  optional int32 bucket_id = 1;
  repeated EventBaseUpgradeSlotProto collection = 2;
}

message EventUpgradeSlotGroupProto {
  optional int32 id = 1;
  optional string name = 2;
  optional string icon = 3;
  optional string image = 4;
}

message EventUpgradeSlotProto {
  optional int32 stars = 1;
  optional int32 steps = 2;
  optional EventUpgradeSlotTypeProto slot_type = 3;
  optional int32 detail_id = 4;
  optional int32 base_slot_id = 5;
  optional SlotDetailProto slot_detail = 6;
}

message EventUpgradeSlotTypeProto {
  optional string type = 1;
}

message EventUpgradeValue {
  optional int32 type = 1;
  optional float value = 2;
}

message EventUserCarPayload {
  repeated EventUpgradeSlotProto event_upgrade_slots = 1;
}

message EventUserDataProto {
  optional int64 event_instance_id = 1;
  optional EventFuelModelProto fuel = 2;
  optional UserCarProto user_car = 3;
  optional EventWalletProto wallet = 4;
  optional EventProgressProto progress = 5;
  repeated EventStepModelProto event_step_model = 6;
  repeated int32 taken_rewards = 7;
  optional InventoryProto inventory = 8;
  optional SecretRewardsModelProto secret_rewards = 9;
  optional EventShopDataProto shop_data = 10;
}

message EventWalletProto {
  optional MoneyProto money = 1;
  optional int32 stars = 2;
}

message EventsDatabaseProto {
  repeated EventsDatabaseProto lmobi/square/sr/android/su0;->a:[_i = 1;
  repeated EventProto event = 2;
  repeated EventConfigProto event_config = 3;
  repeated EventStageProto event_stage = 4;
  repeated EventHelpProto event_help = 5;
  repeated EventColorThemeProto color_theme = 6;
  repeated EventUpgradeSlotBaseBucketProto upgrade_slots_base = 7;
  repeated EventUpgradeSlotGroupProto event_upgrade_slot_groups = 8;
  repeated EventBaseUpgradeSlotDetailProto upgrade_slot_details = 9;
  repeated ARewardBucketProto level_rewards_bucket = 10;
  repeated bytes /* message type unresolved */ secret_rewards_bucket = 11;
  repeated UniversalBucketProto shop_items_buckets = 12;
}

message SecretRewardsModelProto {
  repeated int32 rewards_ids = 1;
}

message SlotDetailProto {
  optional int64 id = 1;
  optional int32 base_id = 2;
}

message StatisticProto {
  optional int32 attempts_before_win = 1;
  optional int32 attempts_after_win = 2;
  optional int32 failed_attempts = 3;
  optional int32 successful_attempts = 4;
}

message UniversalBucketProto {
  optional int32 bucket_id = 1;
  repeated bytes collection = 2;
}

message UserCardInfoProto {
  optional UserInfoProto user_info = 1;
  optional CarSafeProto car_safe_proto = 2;
}
