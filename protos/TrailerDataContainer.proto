// Recovered from the client's protobuf-lite descriptors. Not recoverable: field names inside
// oneof groups, map key/value types; enum type names may be shortened by obfuscation.
syntax = "proto2";

option java_outer_classname = "TrailerDataContainer";

message TrailerCarcass {
  optional float x = 1;
  optional float y = 2;
  optional float width = 3;
  optional float height = 4;
  optional float angle = 5;
}

message TrailerDataParams {
  optional int64 car_i_d = 1;
}

message TrailerDataProto {
  optional Wheel rear_wheel = 1;
  optional TrailerCarcass carcass = 2;
}

message Wheel {
  optional float x = 1;
  optional float y = 2;
  optional float angle = 3;
}
